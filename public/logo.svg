<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Mega Bot">
  <defs>
    <style>
      .bg { fill: #E8F4FD; }
      .body { fill: #4A90D9; stroke: #2E6EB5; stroke-width: 6; }
      .eye { fill: #FFFFFF; }
      .pupil { fill: #2E6EB5; }
      .mouth { fill: #2E6EB5; }
      .antenna { fill: #2E6EB5; }
    </style>
  </defs>
  <!-- background rounded -->
  <rect x="6" y="6" width="188" height="188" rx="28" class="bg" />

  <!-- head/body -->
  <rect x="34" y="48" width="132" height="104" rx="18" class="body" />

  <!-- eyes -->
  <rect x="64" y="82" width="28" height="22" rx="6" class="eye" />
  <circle cx="78" cy="93" r="6" class="pupil" />

  <rect x="108" y="82" width="28" height="22" rx="6" class="eye" />
  <circle cx="122" cy="93" r="6" class="pupil" />

  <!-- mouth -->
  <rect x="78" y="114" width="44" height="12" rx="6" class="mouth" />

  <!-- antenna -->
  <rect x="96" y="28" width="8" height="28" rx="4" class="antenna" />
  <circle cx="100" cy="22" r="8" class="antenna" />

  <!-- small decorations -->
  <circle cx="54" cy="126" r="6" fill="#fff" opacity="0.15" />
  <circle cx="146" cy="126" r="6" fill="#fff" opacity="0.15" />
</svg>
